# Vhodna konfiguracija za KES v7 sinhronski motor.
# Vsa polja so neobvezna; manjkajoča prevzamejo privzete vrednosti iz src/inputs.py.

machine:
  m: 3
  p: 3
  U_f: 190          # V (faznoRMS) — znižano s 200 V, da po FEMM zaokroževanju
                    # N_s navzgor pridemo blizu 190 V (uporabnikova zahteva)
  P_c: 60000        # W (povečano s 50 kW). Pri P_c=56 kW GA izbira manjše
                    # stroje z višjim B_δ in saturiranim železom, FEMM pa je
                    # dosegel le 64 Nm (M_c = 76.4). S P_c=60 kW analitično
                    # M_c = 81.85 Nm; FEMM pri ~90 % ujemanju da M ≈ 73 Nm.
                    # Volumen naraste ~20 % v skladu s povišanjem nazivne moči.
  n_c: 7000         # rpm (vogalna točka)
  n_max: 14000      # rpm
  cos_phi: 0.95
  eta_init: 0.95
  material: M330-35A

material:
  rho_fe: 7650
  k_fe: 0.97
  k_fe_tooth: 2.0
  k_fe_yoke: 1.6
  T_operating: 80
  K_Cu_stator: 0.38
  K_Cu_rotor: 0.60
  J_cu_s_max: 10
  J_cu_r_max: 5

bounds:
  # Geometrija — zožan V razpon na 3500–8000 cm³ in proporcionalni stroji.
  # Zaostreno glede na D05 "sweet-spot" analizo:
  # D05 dosega največji M (73.5 Nm), najnižji THD (11.5%), U_ind blizu 190V,
  # ker je ekstremen v B_sy=1.50, J_cu_s=10.0, B_ds=1.69 (vsi na mejah).
  # Te meje sedaj zaostrimo, da GA preferira tovrstne "kompaktne, gostonatovorjene"
  # stroje — več designov na Pareto fronti bo D05-tipa.
  D_r_min: 0.135      # m
  D_r_max: 0.180      # m  (zožano z 0.195 → manjši stroji v ospredju)
  l_to_D_min: 0.7
  l_to_D_max: 2.5
  B_delta_min: 1.00
  B_delta_max: 1.15   # zožano z 1.20 — preprečuje pretirano nasičenost zr. reže
  B_ds_min: 1.55      # povišano z 1.2 — vsi D05-like stroji so blizu 1.7
  B_ds_max: 1.7
  B_sy_min: 1.30      # povišano z 1.0 — kompakten statorski jarem (D05 ima 1.50)
  B_sy_max: 1.5
  J_cu_s_min: 7.0     # povišano z 3.0 — visoka gostota toka v statorju
  J_cu_s_max: 10.0
  J_cu_r_min: 2.0
  J_cu_r_max: 5.0
  N_r_min: 50         # zaostreno z 10 — prisili visok N_r kot pri D05 (N_r=55),
                      # kar daje večji F_m = N_r·I_m za isti analitični B_δ →
                      # višji FEMM navor. GA bi sicer izbral N_r 28-38 zaradi
                      # η optimizacije, kar pa daje manj MMF in manj navora.
  N_r_max: 80
  q_choices: [2.0]
  # Q_s = 2*p*m*q  ⇒  q=2 ⇒ Q_s=36.
  # Pri manjšem D_r (130–188 mm) z l/D≥1 q∈{2.5,3} ustvarja zelo ozke zobje
  # (Q_s=45/54), kar pri FEMM povzroči eksplozijo mreže in ~10× počasnejši
  # solver. Pri starem zagonu je GA tako ali tako za vseh 5 designov izbral
  # q=2 — zato to fiksiramo tudi tu.
  q_choices: [2.0]
