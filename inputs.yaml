# Vhodna konfiguracija za KES v7 sinhronski motor.
# Vsa polja so neobvezna; manjkajoča prevzamejo privzete vrednosti iz src/inputs.py.

machine:
  m: 3
  p: 3
  U_f: 200          # V (faznoRMS)
  P_c: 50000        # W
  n_c: 7000         # rpm (vogalna točka)
  n_max: 14000      # rpm
  cos_phi: 0.95
  eta_init: 0.95
  material: M330-35A

material:
  rho_fe: 7650
  k_fe: 0.97
  k_fe_tooth: 2.0
  k_fe_yoke: 1.6
  T_operating: 80
  K_Cu_stator: 0.38
  K_Cu_rotor: 0.60
  J_cu_s_max: 10
  J_cu_r_max: 5

bounds:
  # Geometrija — sili "daljše in ožje" stroje, da se izognemo preploščati
  # tehnološko neugodni geometriji (prejšnja l/D = 0.4 ni primerna za izvedbo).
  D_r_min: 0.130      # m  (manj kot prej 0.100, da damo GA več variacije v ozkih)
  D_r_max: 0.250      # m  (manj kot prej 0.300, omeji preveč debele rotorje)
  l_to_D_min: 1.0     # L_r ≥ D_r — strogo "dolgi" stroji
  l_to_D_max: 2.5     # dovoli tudi izrazito vitke stroje
  B_delta_min: 0.6
  B_delta_max: 1.05
  B_ds_min: 1.2
  B_ds_max: 1.7
  B_sy_min: 1.0
  B_sy_max: 1.5
  J_cu_s_min: 3.0
  J_cu_s_max: 10.0
  J_cu_r_min: 2.0
  J_cu_r_max: 5.0
  N_r_min: 10
  N_r_max: 80
  # Q_s = 2*p*m*q  ⇒  q=2 ⇒ Q_s=36.
  # Pri manjšem D_r (130–188 mm) z l/D≥1 q∈{2.5,3} ustvarja zelo ozke zobje
  # (Q_s=45/54), kar pri FEMM povzroči eksplozijo mreže in ~10× počasnejši
  # solver. Pri starem zagonu je GA tako ali tako za vseh 5 designov izbral
  # q=2 — zato to fiksiramo tudi tu.
  q_choices: [2.0]
