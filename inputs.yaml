# Vhodna konfiguracija za KES v7 sinhronski motor.
# Vsa polja so neobvezna; manjkajoča prevzamejo privzete vrednosti iz src/inputs.py.

machine:
  m: 3
  p: 3
  U_f: 190          # V (faznoRMS) — znižano s 200 V, da po FEMM zaokroževanju
                    # N_s navzgor pridemo blizu 190 V (uporabnikova zahteva)
  P_c: 50000        # W
  n_c: 7000         # rpm (vogalna točka)
  n_max: 14000      # rpm
  cos_phi: 0.95
  eta_init: 0.95
  material: M330-35A

material:
  rho_fe: 7650
  k_fe: 0.97
  k_fe_tooth: 2.0
  k_fe_yoke: 1.6
  T_operating: 80
  K_Cu_stator: 0.38
  K_Cu_rotor: 0.60
  J_cu_s_max: 10
  J_cu_r_max: 5

bounds:
  # Geometrija — zožan V razpon na 3500–8000 cm³ in proporcionalni stroji.
  D_r_min: 0.140      # m (V_min ≈ 3700 cm³ pri l/D = 0.7)
  D_r_max: 0.195      # m (V_max ≈ 8300 cm³ pri l/D = 0.7)
                      # Opomba: poskus razširitve na 0.220 m je padel navor
                      # — GA s preselektiral na sredinske stroje z manj železa,
                      # M je padel za 5-12 Nm. Pravilo M ∝ D²·L pri V=const
                      # tu deluje proti nam.
  l_to_D_min: 0.7
  l_to_D_max: 2.5
  B_delta_min: 1.00   # povišano z 0.6 — prisili GA, da izbira stroje z visokim
                      # magnetnim potencialom (sicer GA optimizira η in izbira
                      # nižji B_δ, kar daje premajhen navor). FEMM navor sistemsko
                      # doseže ~85 % analitičnega cilja zaradi saturacije v zobu
                      # in harmonikov; B_δ ≥ 1.10 ne pomaga več (zob nasičen).
  B_delta_max: 1.20
  B_ds_min: 1.2
  B_ds_max: 1.7
  B_sy_min: 1.0
  B_sy_max: 1.5
  J_cu_s_min: 3.0
  J_cu_s_max: 10.0
  J_cu_r_min: 2.0
  J_cu_r_max: 5.0
  N_r_min: 10
  N_r_max: 80
  # Q_s = 2*p*m*q  ⇒  q=2 ⇒ Q_s=36.
  # Pri manjšem D_r (130–188 mm) z l/D≥1 q∈{2.5,3} ustvarja zelo ozke zobje
  # (Q_s=45/54), kar pri FEMM povzroči eksplozijo mreže in ~10× počasnejši
  # solver. Pri starem zagonu je GA tako ali tako za vseh 5 designov izbral
  # q=2 — zato to fiksiramo tudi tu.
  q_choices: [2.0]
