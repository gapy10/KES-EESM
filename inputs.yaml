# Vhodna konfiguracija za KES v7 sinhronski motor.
# Vsa polja so neobvezna; manjkajoča prevzamejo privzete vrednosti iz src/inputs.py.

machine:
  m: 3
  p: 3
  U_f: 200          # V (fazna RMS) — napajalna (sponkovna) napetost = U_grid,
                    # skladno z opisom naloge. Tok računamo z 200 V; EMS
                    # prostega teka pa dimenzioniramo na ≤ 0.95·U_grid = 190 V
                    # (točka L), z rezervo prek emf_target_factor v analitiki.
  P_c: 50000        # W — nazivna moč v vogalni točki (spec naloge: 50 kW pri
                    # 7000 rpm). M_c = P_c/ω_meh = 68.21 Nm. Model targetira
                    # poštene 50 kW; dejanski FEMM navor je rezultat verifikacije.
  P_c_min_FEMM: 50000  # W — informativno (spec naloge). Ni GA omejitev.
  n_c: 7000         # rpm (vogalna točka)
  n_max: 14000      # rpm
  cos_phi: 0.95
  eta_init: 0.95
  material: M330-35A

material:
  rho_fe: 7650
  k_fe: 0.97
  k_fe_tooth: 2.0           # nazaj na originalno (privzeto), ker faktor velja
  k_fe_yoke: 1.6            # tako za analitiko kot za FEMM post-procesiranje
  # FEMM kalibracija B za predikcijo izgub (saturacija B-H krivulje zniža
  # realni B za ~14 % od projektiranega cilja):
  k_B_femm_factor: 0.86     # B_FEMM/B_target — analitika napoveduje izgube iz
                            # dejanskega FEMM B. (Navorne korekcije toka NI več.)
  T_operating: 80
  K_Cu_stator: 0.38
  K_Cu_rotor: 0.60
  J_cu_s_max: 10
  J_cu_r_max: 5

bounds:
  # Realne inženirske meje (po odstranitvi nekdanjih "D05-tip" hackov, ki so
  # silili nasičene zobe/jarme in napihovali tok). Magnetne obremenitve so
  # zdaj v tipičnih oknih za neorientirano pločevino M330-35A:
  #   B_δ 0.85–1.05 T (amplituda v zr. reži), B_zob ≤ 1.7 T, B_jarem ≤ 1.5 T.
  # l/D ≥ 1.0 prepreči tehnološko neugodne ploščate stroje (zahteva opisa
  # naloge: "ne preveč ploščati motorji z velikim radijem in majhno dolžino").
  D_r_min: 0.145      # m — pod ~0.145 m FEMM ne zgradi vseh regij ("Material
                      # properties not defined for all regions"); empirično
                      # potrjeno (135/140 padeta, 145/150 zgradita).
  D_r_max: 0.175      # m
  l_to_D_min: 1.0     # ≥ 1.0 — osno vsaj tako dolg kot širok rotor (ne ploščat)
  l_to_D_max: 2.2
  B_delta_min: 0.85   # T — tipična amplituda fundamentalne B v zr. reži
  B_delta_max: 1.05
  B_ds_min: 1.30      # B v statorskem zobu [T]
  B_ds_max: 1.70
  B_sy_min: 1.00      # B v statorskem jarmu [T]
  B_sy_max: 1.50      # jarem realno nasiči pri ~1.5 T (ne 1.65)
  J_cu_s_min: 4.0     # A/mm² — nizka gostota = manj Cu izgub (učinkoviti del fronte)
  J_cu_s_max: 10.0    # zgornja meja po nalogi (točka A)
  J_cu_r_min: 2.0
  J_cu_r_max: 5.0     # zgornja meja po nalogi (točka A)
  N_r_min: 40         # ovojev na rotorski pol — širši razpon zaradi večje
  N_r_max: 100        # zr. reže (2 mm) → potreben večji F_m = N_r·I_m na pol
  # Q_s = 2*p*m*q  ⇒  q=2 ⇒ Q_s=36. Fiksiramo q=2: pri majhnem D_r z l/D≥1
  # bi q∈{2.5,3} (Q_s=45/54) dal zelo ozke zobe in eksplozijo FEMM mreže.
  q_choices: [2.0]
